<style>
  /*
   * The five variable names are inherited from next-digital-wall-calendar, which took them from
   * shadcn/ui. They are kept verbatim so the ported SVG carries across without editing a single
   * colour reference — see ADR 0007. The vocabulary reads oddly out of that context:
   * `--destructive` is the second hand, not an error state.
   *
   * Contrast ratios are against --card, the face's own background, and are why these particular
   * values were chosen. They describe the face: the numerals, ticks, hands and AM/PM the notes
   * name are all drawn inside the face circle. Two of these tokens are also used on the arc band
   * outside it, where the ground is --page and the ratio is not the one quoted — --border is the
   * window track (1.86:1 there, composited at half opacity) and --card-foreground is an elapsed
   * arc's title. WCAG asks 4.5:1 for body text and 3:1 for graphical objects; a display read from
   * the back of a room has no margin to give away, so nothing here sits near the floor.
   */
  :root {
    --card: #16181d;
    --card-foreground: #f2f4f8; /* 17:1 — numerals, hour markers, hands */
    --border: #6b7280; /*  3.7:1 — face outline, minute ticks */
    --muted-foreground: #9aa3b2; /*  7:1   — AM/PM, status line */
    --destructive: #ef4444; /*  4.7:1 — second hand */
    /*
     * The ground the arc band is drawn on: the band sits outside the face circle, so what is
     * behind it is the page and not --card (#74). Also declared as BAND_BACKGROUND in
     * event-arc.ts, where contrast.ts measures elapsed outlines against it.
     */
    --page: #0c0e12;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--page);
    color: var(--card-foreground);
    font-family: system-ui, -apple-system, sans-serif;
    line-height: 1.5;
  }

  /* The display carries nothing but the dial and, when something is wrong, one line of text. */
  #display {
    min-height: 100vh;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 1.5rem;
    padding: 2vmin;
  }

  /*
   * Sized from the smaller viewport axis so the dial fills a display of any shape, with a little
   * held back for floating labels, which paint outside the SVG box by design.
   */
  #dial {
    width: min(88vmin, 100%);
  }

  #dial svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
  }

  #status {
    margin: 0;
    text-align: center;
    /* Read from a distance, but never competing with the dial. */
    font-size: clamp(1rem, 2.2vmin, 1.5rem);
    color: var(--muted-foreground);
  }

  #status[hidden] {
    display: none;
  }

  /* ----- Bring-up diagnostics, only present with ?check=1 ----- */

  .panel {
    max-width: 48rem;
    margin: 2rem auto;
    padding: 1.5rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    font-size: 1.25rem;
  }

  .panel h2 {
    font-size: 1.5rem;
    margin: 0 0 0.5rem;
  }

  .emoji {
    font-size: 3rem;
    letter-spacing: 0.25rem;
    margin: 0.5rem 0;
  }

  .note {
    color: var(--muted-foreground);
    font-size: 1rem;
  }

  code {
    font-family: ui-monospace, monospace;
    font-size: 0.9em;
    padding: 0.1em 0.35em;
    background: var(--page);
    border: 1px solid var(--border);
    border-radius: 0.25rem;
  }

  dl {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 0.5rem 1.5rem;
    margin: 0 0 1rem;
  }

  dt {
    font-family: ui-monospace, monospace;
  }

  dd {
    margin: 0;
  }

  /* State is carried by a glyph as well as a colour — never colour alone. */
  dd[data-state="ok"]::before {
    content: "✓ ";
    color: #22c55e;
  }

  dd[data-state="note"]::before {
    content: "• ";
    color: var(--muted-foreground);
  }

  dd[data-state="fail"]::before {
    content: "✗ ";
    color: var(--destructive);
  }
</style>
