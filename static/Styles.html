<style>
  /*
   * The five variable names are inherited from next-digital-wall-calendar, which took them from
   * shadcn/ui. They are kept verbatim so the ported SVG carries across without editing a single
   * colour reference — see ADR 0007. The vocabulary reads oddly out of that context:
   * `--destructive` is the second hand, not an error state.
   *
   * Values here are a first pass. #4 tunes them against the real dial, at projector contrast.
   */
  :root {
    --card: #16181d;
    --card-foreground: #f2f4f8;
    --border: #3a3f4b;
    --muted-foreground: #9aa3b2;
    --destructive: #ef4444;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 2rem;
    background: #0c0e12;
    color: var(--card-foreground);
    font-family: system-ui, -apple-system, sans-serif;
    /* Read from across a room, not from a desk. */
    font-size: 1.25rem;
    line-height: 1.6;
  }

  main {
    max-width: 48rem;
    margin: 0 auto;
  }

  h1 {
    margin: 0;
    font-size: 2.5rem;
  }

  h2 {
    font-size: 1.5rem;
    margin-bottom: 0.5rem;
  }

  .lede {
    color: var(--muted-foreground);
    margin-top: 0.25rem;
  }

  section {
    margin-top: 2.5rem;
    padding: 1.5rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 0.5rem;
  }

  .emoji {
    font-size: 3rem;
    letter-spacing: 0.25rem;
    margin: 0.5rem 0;
  }

  .note {
    color: var(--muted-foreground);
    font-size: 1rem;
  }

  code {
    font-family: ui-monospace, monospace;
    font-size: 0.9em;
    padding: 0.1em 0.35em;
    background: #0c0e12;
    border: 1px solid var(--border);
    border-radius: 0.25rem;
  }

  dl {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 0.5rem 1.5rem;
    margin: 0 0 1rem;
  }

  dt {
    font-family: ui-monospace, monospace;
  }

  dd {
    margin: 0;
  }

  /* State is carried by a glyph as well as a colour — never colour alone. */
  dd[data-state="ok"]::before {
    content: "✓ ";
    color: #22c55e;
  }

  dd[data-state="note"]::before {
    content: "• ";
    color: var(--muted-foreground);
  }

  dd[data-state="fail"]::before {
    content: "✗ ";
    color: var(--destructive);
  }
</style>
