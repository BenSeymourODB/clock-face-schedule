<style>
  /*
   * The five variable names are inherited from next-digital-wall-calendar, which took them from
   * shadcn/ui. They are kept verbatim so the ported SVG carries across without editing a single
   * colour reference — see ADR 0007. The vocabulary reads oddly out of that context:
   * `--destructive` is the second hand, not an error state.
   *
   * Contrast ratios are against --card, the face's own background, and are why these particular
   * values were chosen. They describe the face: the numerals, ticks, hands and AM/PM the notes
   * name are all drawn inside the face circle. Two of these tokens are also used on the arc band
   * outside it, where the ground is --page and the ratio is not the one quoted — --border is the
   * window track (1.86:1 there, composited at half opacity) and --card-foreground is an elapsed
   * arc's title. WCAG asks 4.5:1 for body text and 3:1 for graphical objects; a display read from
   * the back of a room has no margin to give away, so nothing here sits near the floor.
   */
  :root {
    --card: #16181d;
    --card-foreground: #f2f4f8; /* 17:1 — numerals, hour markers, hands */
    --border: #6b7280; /*  3.7:1 — face outline, minute ticks */
    --muted-foreground: #9aa3b2; /*  7:1   — AM/PM, status line */
    --destructive: #ef4444; /*  4.7:1 — second hand */
    /*
     * The ground the arc band is drawn on: the band sits outside the face circle, so what is
     * behind it is the page and not --card (#74). Also declared as BAND_BACKGROUND in
     * event-arc.ts, where contrast.ts measures elapsed outlines against it.
     */
    --page: #0c0e12;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--page);
    color: var(--card-foreground);
    font-family: system-ui, -apple-system, sans-serif;
    line-height: 1.5;
  }

  /*
   * The display carries nothing but the dial and, when something is wrong, one line of text.
   *
   * Both tracks are declared, and that is the whole of #115. An auto-sized column is sized from
   * its items' max-content, and the dial's contribution to that is the SVG's own `width="600"`
   * attribute — a percentage counts as `auto` while intrinsic sizes are being resolved. So a
   * percentage width on #dial resolved against a track the dial had just sized, `min(88vmin, 600)`
   * picked 600, and the rule was a fixed point at its own attribute: 600 px on a 4K board and on a
   * laptop alike. The only thing that broke the cycle was a *sibling* wider than 600 — the status
   * line — which made a failed fetch grow the dial by 58% while nothing about the schedule changed.
   *
   * Declaring both tracks moves the notice's cost into the axis it belongs in: it takes height from
   * the dial, and the dial's width stops depending on how long the sentence is.
   */
  #display {
    /*
     * The frame the floating labels paint into, and the reason the dial is not the whole of the
     * board's height. Cards sit outside the SVG box by design and reach at most 50.4 units past the
     * 600-unit viewBox: horizontally that is `labelWidthLimit` holding a card's *edges* within
     * `OVERFLOW_RATIO` (0.1) of the dial's 584-unit box, whose own edge is inset 8 units, so
     * 58.4 − 8; vertically it is a four-line card on the label locus, 297.84 + 52.06 − 300 = 49.9,
     * which no clamp enforces — the vertical clamp bounds a card's centre and never binds against
     * that locus, so `dial-frame.test.ts` is what holds it.
     *
     * A frame of `A` per cent of the shorter viewport axis leaves `600A / (100 − 2A)` units beside
     * a dial sized from what is left, so covering 50.4 takes 7.19%. 7.3 provides 51.3.
     *
     * The `2vmin` this replaces was never the constraint — a 600 px dial centred in a 1080 px page
     * had 240 px of slack above it, and the slack is what the labels were using. Sizing the dial to
     * the board takes the slack away, so the frame has to be stated.
     *
     * It is not free: at 1920×1080 this is a 922.3 px dial that never clips a card, against a
     * 1036.8 px one that clips at twelve and six. A clipped card is the only copy of a title that
     * did not fit its arc, so it wins. #121 is the cheaper way to get that height back, and #39 is
     * where the number gets retuned if the allocation changes.
     */
    --label-frame: 7.3vmin;

    height: 100vh;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    /*
     * `minmax(0, 1fr)` and not `1fr`: a bare `1fr` floors the track at its content's own height,
     * and the dial's content wants to be as tall as the column is wide, so the track would grow to
     * 1877 px on a 1080-tall board and the page would scroll. Flooring it at zero makes the track
     * the height actually available, which is what the dial then takes a percentage of.
     */
    grid-template-rows: minmax(0, 1fr) auto;
    align-items: center;
    justify-items: center;
    padding: var(--label-frame);
  }

  /*
   * ADR 0009's allocation, as a layout: the dial keeps the board's full height and the panel takes
   * 180 of the dial's 600 units beside it (#39).
   *
   * **Flex, not two grid columns**, and that is the whole of why this element exists. Grid resolves
   * column widths before row heights, so a panel sized from the row's height cannot contribute a
   * width to an `auto` column — which is the circularity the previous note here described as "a
   * number CSS cannot see". A flex row resolves it in the order that works: `align-items: stretch`
   * makes the panel's height definite from this box first, and `aspect-ratio` then makes its width
   * definite too. Nothing measures a size in script to set another size.
   */
  #board {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: stretch;
  }

  /*
   * The remainder after the panel. The drawing inside it fits the shorter axis, so height binds on
   * anything wider than it is tall (every 16:9 and 16:10 board) and width binds on a portrait or
   * near-square one instead of the dial painting off the frame — and *being centred in the
   * remainder is then the same sentence as the ADR's*.
   *
   * `flex: 1 1 0` rather than `auto`: an `auto` basis is the content's own size, and the dial's
   * content contributes the SVG's `width="600"` attribute, which is the fixed point #115 was.
   * A zero basis makes this exactly "what is left", with `min-width: 0` so it may be less than 600.
   */
  #dial {
    flex: 1 1 0;
    min-width: 0;
    height: 100%;
  }

  /*
   * The panel's column, 180 units against the dial's 600 (ADR 0009).
   *
   * The ratio *is* the ADR's two numbers, so the stylesheet states the allocation rather than a
   * pixel figure derived from it. `panel-layout.test.ts` reads this declaration back and compares it
   * against `PANEL_RESERVE_UNITS` — the same width `label-margin.ts` holds out of the labels'
   * allowance — so the column drawn and the width reserved for it cannot drift apart.
   *
   * `height: 100%` as well as the container's `stretch`, so the cross size is definite from a
   * percentage of a definite box rather than only from stretching. That is what `aspect-ratio` needs
   * in order to give a definite width.
   *
   * Hidden by the client, not by a media query, when the board cannot afford the panel — measured on
   * `#board`, whose size does not depend on whether the panel is in it. Two conditions, and the
   * second was found by rendering: the dial must keep its full height (ADR 0009's absolute), *and*
   * the room left beside the dial must stay above ADR 0009's 75.4-unit knee, below which the panel
   * and the labels trade width one-for-one. A card cannot land on the column at all, because the
   * host grants the labels the room that actually exists beside the dial once this column is up --
   * see `measureLabelMargin`. The frame above is the *vertical* allowance and was the wrong currency
   * for this: a 1-hour dial's card reaches 138.7 units where the frame is 51.3.
   *
   * The dial then keeps the whole remainder, which is the layout as it was before this column
   * existed. What a narrow board *should* show instead is #39 item 4 and is still open; absent is not
   * collapsed.
   */
  #panel {
    flex: 0 0 auto;
    height: 100%;
    aspect-ratio: 180 / 600;
  }

  #panel[hidden] {
    display: none;
  }

  #panel svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  /*
   * The box is the room available; the drawing is the square inside it. `preserveAspectRatio`
   * defaults to `xMidYMid meet`, so the dial scales to fit the shorter axis and centres on the
   * other — which is "keep the board's height, centre in the remaining width" on any landscape
   * board, and clamps to the width on a portrait one, with no distortion either way. The SVG's own
   * `width`/`height` attributes are a fallback for a page with no stylesheet and deliberately have
   * no say here: both axes of the box are definite, so nothing resolves against them — which is the
   * property that has to hold, since resolving against them is what #115 was.
   */
  #dial svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  #status {
    /*
     * The same frame the page leaves at its edges, for the same reason: the dial is flush against
     * this row, and a card at six o'clock reaches as far past the viewBox as one at twelve. The
     * grid's `gap` cannot do this job — it is charged between tracks whether or not the second holds
     * anything, so a hidden notice would still cost the dial 51.3 units it does not need to give.
     */
    margin: var(--label-frame) 0 0;
    text-align: center;
    /* Read from a distance, but never competing with the dial. */
    font-size: clamp(1rem, 2.2vmin, 1.5rem);
    color: var(--muted-foreground);
  }

  #status[hidden] {
    display: none;
  }

  /* ----- Bring-up diagnostics, only present with ?check=1 ----- */

  .panel {
    max-width: 48rem;
    margin: 2rem auto;
    padding: 1.5rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    font-size: 1.25rem;
  }

  .panel h2 {
    font-size: 1.5rem;
    margin: 0 0 0.5rem;
  }

  .emoji {
    font-size: 3rem;
    letter-spacing: 0.25rem;
    margin: 0.5rem 0;
  }

  .note {
    color: var(--muted-foreground);
    font-size: 1rem;
  }

  code {
    font-family: ui-monospace, monospace;
    font-size: 0.9em;
    padding: 0.1em 0.35em;
    background: var(--page);
    border: 1px solid var(--border);
    border-radius: 0.25rem;
  }

  dl {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 0.5rem 1.5rem;
    margin: 0 0 1rem;
  }

  dt {
    font-family: ui-monospace, monospace;
  }

  dd {
    margin: 0;
  }

  /* State is carried by a glyph as well as a colour — never colour alone. */
  dd[data-state="ok"]::before {
    content: "✓ ";
    color: #22c55e;
  }

  dd[data-state="note"]::before {
    content: "• ";
    color: var(--muted-foreground);
  }

  dd[data-state="fail"]::before {
    content: "✗ ";
    color: var(--destructive);
  }
</style>
