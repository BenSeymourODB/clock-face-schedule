name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR makes the in-flight run's verdict irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    # Checkout, install, and npm scripts. Nothing here writes to the repository.
    permissions:
      contents: read
    # The gate runs in about a minute; the realistic failure is a hang, not a slow run.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The engines floor rather than the maintainer's local version, so CI proves the version
      # the package claims to support still runs. ES2019 conformance is check-types' job, via
      # the tsconfigs' lib setting — Node 20 has replaceAll and would not catch it.
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run check-types

      - run: npm test
