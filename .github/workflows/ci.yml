name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR makes the in-flight run's verdict irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The engines floor, not the maintainer's local version: a newer-than-ES2019 API that
      # tsc misses should fail here rather than on someone else's machine.
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run check-types

      - run: npm test
