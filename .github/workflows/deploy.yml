name: Deploy

# Two slots, one job body. Staging tracks `main`, production is what a published release means, and
# the dispatch covers everything neither does — a re-deploy, or a rollback from an older ref. All
# three are the same two clasp calls — `push` then `redeploy` — against a different deployment ID,
# which is the whole of what makes a stable web app URL possible. See ADR 0010.
on:
  push:
    branches: [main]
  # `published` rather than `released` or `prereleased`, because it is the only type that fires for
  # both a stable release and a pre-release — including a pre-release published from a draft, which
  # `prereleased` misses. This repo's releases are pre-releases, so the narrower types would mean a
  # production deploy that never ran. Flip to `[released]` if pre-releases should stop at staging.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      slot:
        description: Which slot to redeploy
        type: choice
        options: [staging, production]
        default: staging

# Deploys queue; they are never cancelled. `clasp redeploy` creates an immutable version and *then*
# repoints the slot at it, so a run killed between those two calls leaves the slot on its old
# version with an orphan version above it. This is the opposite of ci.yml, where a superseded run's
# verdict is merely irrelevant — here a superseded run may be halfway through mutating the project.
concurrency:
  group: deploy-${{ github.event_name == 'release' && 'production' || inputs.slot || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    # This expression appears four times — here, in `concurrency`, in `environment.name` and in
    # `SLOT` — because Actions offers nowhere to name it once: `env` is not a context those first
    # three can read, and the format supports no anchors. The four must stay identical, since a
    # disagreement between them would gate on one environment's reviewers while deploying the
    # other's deployment ID. `scripts/deploy-workflow.test.mjs` asserts they match.
    name: deploy (${{ github.event_name == 'release' && 'production' || inputs.slot || 'staging' }})
    runs-on: ubuntu-latest

    # The slot's identity lives in the GitHub environment, not in this file: `CLASP_DEPLOYMENT_ID`
    # is environment-scoped, so one job body serves both slots and production can carry required
    # reviewers without the workflow knowing. `SCRIPT_ID` is repo-wide because both slots are
    # deployments *of the same script project* — versions are immutable snapshots, so pushing for
    # staging cannot disturb what production is pinned to. Defining SCRIPT_ID on an environment
    # would override the repo value, if the slots ever need to be separate projects.
    environment:
      name: ${{ github.event_name == 'release' && 'production' || inputs.slot || 'staging' }}
      url: ${{ steps.redeploy.outputs.webapp-url }}

    permissions:
      contents: read

    timeout-minutes: 15

    env:
      SLOT: ${{ github.event_name == 'release' && 'production' || inputs.slot || 'staging' }}
      # clasp defaults its auth file to ~/.clasprc.json and does **not** fall back to a local one,
      # whatever its own docs/config-files.md says about "local or global" — measured on 3.4.0,
      # which reports "No credentials found." with a perfectly good .clasprc.json beside
      # .clasp.json. This must also name the file: given a directory, clasp dies with EISDIR
      # despite `--help` advertising folder support.
      clasp_config_auth: .clasprc.json

    steps:
      - uses: actions/checkout@v7
        with:
          # Name the tag explicitly on a release rather than trusting the event's default SHA, so
          # what gets deployed is the commit the release points at and nothing else. Empty on the
          # other two triggers, which checkout treats as "the ref that triggered me" as usual.
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      # First, before anything is built or uploaded. An absent variable should fail here rather
      # than halfway through mutating the Apps Script project, and the empty deployment ID is the
      # one worth being paranoid about: `clasp deploy -i ""` treats an empty ID as "create", so a
      # misconfigured slot would quietly publish a *second*, unlisted web app URL. `clasp redeploy`
      # rejects it instead — which is why this workflow uses `redeploy` and not the otherwise
      # identical `deploy -i` — and this step rejects it earlier, with a message that says what to do.
      - name: Check the slot is configured
        shell: bash
        env:
          SCRIPT_ID: ${{ vars.SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ vars.CLASP_DEPLOYMENT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          missing=()
          [[ -n "$SCRIPT_ID" ]] || missing+=("variable SCRIPT_ID (repository or environment)")
          [[ -n "$DEPLOYMENT_ID" ]] || missing+=("variable CLASP_DEPLOYMENT_ID (on the \`$SLOT\` environment)")
          [[ -n "$CLASPRC_JSON" ]] || missing+=("secret CLASPRC_JSON")
          if (( ${#missing[@]} > 0 )); then
            {
              echo "### Deploy is not configured"
              echo
              echo "The \`$SLOT\` slot is missing:"
              echo
              printf '  - %s\n' "${missing[@]}"
              echo
              echo 'See "Continuous deployment" in README.md.'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - run: npm ci

      - run: npm run build

      # The same gate a commit has to pass locally, re-run here rather than inherited from ci.yml.
      # A promotion dispatch can name any ref, including a commit whose CI run predates a
      # dependency change, and the cost of being wrong is a broken dial on a classroom wall.
      - run: npm run check-types

      - run: npm test

      - name: Write clasp configuration
        shell: bash
        env:
          SCRIPT_ID: ${{ vars.SCRIPT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          umask 077
          printf '%s' "$CLASPRC_JSON" > .clasprc.json
          printf '{"scriptId":"%s","rootDir":"build"}\n' "$SCRIPT_ID" > .clasp.json

      # `--force` for the reason ADR 0002 gives: the Apps Script UI writes back to appsscript.json,
      # and on a drifted manifest clasp without --force auto-declines on a non-TTY, prints
      # "Skipping push." and exits 0 — uploading nothing and reporting success.
      - name: Push the bundle
        run: npx clasp push --force

      # No `-V`, which is the entire trick: with the version omitted clasp creates an immutable
      # version from what was just pushed, then repoints this existing deployment at it. The web app
      # URL derives from the deployment ID, so it survives untouched.
      #
      # `-d` is not optional in practice. clasp writes the description on every redeploy, so
      # omitting it blanks the only human-readable label the slot has — naming the slot in the
      # description is what keeps `clasp deployments` readable.
      - name: Redeploy the slot
        id: redeploy
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ vars.CLASP_DEPLOYMENT_ID }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # The tag on a release, the branch otherwise; and the commit actually checked out rather
          # than the event's, which are the same thing only when the tag is the triggering ref.
          ref="${RELEASE_TAG:-$GITHUB_REF_NAME}"

          npx clasp redeploy "$DEPLOYMENT_ID" \
            -d "$SLOT $ref@$(git rev-parse --short HEAD) run ${GITHUB_RUN_NUMBER}" \
            --json > "$RUNNER_TEMP/redeploy.json"
          cat "$RUNNER_TEMP/redeploy.json"

          version="$(node -p 'JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/redeploy.json", "utf8")).versionNumber ?? ""')"
          url="https://script.google.com/macros/s/$DEPLOYMENT_ID/exec"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "webapp-url=$url" >> "$GITHUB_OUTPUT"

      # clasp reports what it asked for; this reads back what the project now says. Cheap, and it
      # is the only step that can tell a successful-looking redeploy of the wrong slot from a
      # correct one.
      - name: Confirm the slot moved
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ vars.CLASP_DEPLOYMENT_ID }}
          VERSION: ${{ steps.redeploy.outputs.version }}
          WEBAPP_URL: ${{ steps.redeploy.outputs.webapp-url }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          npx clasp deployments --json > "$RUNNER_TEMP/deployments.json"
          node -e '
            const fs = require("fs");
            const id = process.env.DEPLOYMENT_ID;
            const want = process.env.VERSION;
            const all = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/deployments.json", "utf8"));
            const slot = all.find((d) => d.deploymentId === id);
            if (!slot) {
              throw new Error(`Deployment ${id} is not one of this project deployments`);
            }
            if (String(slot.versionNumber) !== want) {
              throw new Error(`Slot is on version ${slot.versionNumber}, expected ${want}`);
            }
            console.log(`Confirmed: ${id} is on version ${slot.versionNumber} — "${slot.description}"`);
          '
          {
            echo "### Deployed to \`$SLOT\`"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Version | $VERSION |"
            echo "| Ref | \`${RELEASE_TAG:-$GITHUB_REF_NAME}\` |"
            echo "| Commit | \`$(git rev-parse --short HEAD)\` |"
            echo "| Web app | $WEBAPP_URL |"
          } >> "$GITHUB_STEP_SUMMARY"

      # The runner is ephemeral, but clasp refreshes the access token back into this file, and a
      # credential left lying in the workspace is one a later step could pick up or upload.
      - name: Remove credentials from the workspace
        if: always()
        run: rm -f .clasprc.json
